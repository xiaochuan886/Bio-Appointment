<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约创建测试</title>
</head>
<body>
    <h1>预约创建测试</h1>
    <form id="appointmentForm">
        <div>
            <label>客户姓名: <input type="text" id="customer_name" value="测试客户" required></label>
        </div>
        <div>
            <label>手机号: <input type="text" id="customer_phone" value="13800138000"></label>
        </div>
        <div>
            <label>服务项目:
                <select id="service_id" required>
                    <option value="">请选择服务</option>
                </select>
            </label>
        </div>
        <div>
            <label>预约日期: <input type="date" id="requested_date" required></label>
        </div>
        <div>
            <label>开始时间: <input type="time" id="requested_time_start" required></label>
        </div>
        <div>
            <label>总人数: <input type="number" id="total_people" value="1" min="1"></label>
        </div>
        <div>
            <label>预估时长(分钟): <input type="number" id="estimated_duration" value="60" min="1"></label>
        </div>
        <div>
            <label>急单: <input type="checkbox" id="is_urgent"></label>
        </div>
        <button type="submit">提交预约</button>
    </form>

    <div id="result"></div>

    <script>
        const API_BASE = 'http://localhost:3001/api';

        // 获取Mock Token
        async function getMockToken() {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@test.com',
                        password: 'admin123'
                    })
                });
                const data = await response.json();
                return data.tokens.accessToken;
            } catch (error) {
                console.error('获取token失败:', error);
                return 'mock-access-token';
            }
        }

        // 加载服务列表
        async function loadServices() {
            try {
                const response = await fetch(`${API_BASE}/services`);
                const services = await response.json();
                const select = document.getElementById('service_id');

                services.forEach(service => {
                    const option = document.createElement('option');
                    option.value = service.id;
                    option.textContent = `${service.name} (${service.base_duration}分钟)`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('加载服务失败:', error);
            }
        }

        // 提交预约
        document.getElementById('appointmentForm').onsubmit = async function(e) {
            e.preventDefault();

            const token = await getMockToken();
            const formData = {
                customer_name: document.getElementById('customer_name').value,
                customer_phone: document.getElementById('customer_phone').value,
                service_id: document.getElementById('service_id').value,
                requested_date: document.getElementById('requested_date').value,
                requested_time_start: document.getElementById('requested_time_start').value,
                requested_time_end: document.getElementById('requested_time_start').value + ':00', // 简化处理
                total_people: parseInt(document.getElementById('total_people').value),
                estimated_duration: parseInt(document.getElementById('estimated_duration').value),
                is_urgent: document.getElementById('is_urgent').checked,
                companion_names: null,
                notes: '测试预约'
            };

            console.log('提交数据:', formData);

            try {
                const response = await fetch(`${API_BASE}/appointments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('result').innerHTML =
                        `<h3 style="color: green;">预约创建成功！</h3><pre>${JSON.stringify(result, null, 2)}</pre>`;
                } else {
                    document.getElementById('result').innerHTML =
                        `<h3 style="color: red;">预约创建失败！</h3><p>${result.error || result.message}</p><pre>${JSON.stringify(result, null, 2)}</pre>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML =
                    `<h3 style="color: red;">网络错误！</h3><p>${error.message}</p>`;
            }
        };

        // 初始化
        loadServices();

        // 设置默认日期为今天
        document.getElementById('requested_date').valueAsDate = new Date();
    </script>
</body>
</html>
