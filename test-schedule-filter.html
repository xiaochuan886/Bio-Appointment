<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排班过滤测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>排班过滤测试</h1>
        <p>测试周视图和月视图是否正确过滤掉已取消的排班</p>
        
        <button onclick="testScheduleFilter()">开始测试</button>
        <button onclick="clearResults()">清除结果</button>
        
        <div id="results"></div>
    </div>

    <script>
        async function testScheduleFilter() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info">测试进行中...</div>';
            
            try {
                // 模拟排班数据
                const mockSchedules = [
                    { id: 1, status: 'scheduled', scheduled_date: '2025-12-10', appointment: { customer_name: '张三' } },
                    { id: 2, status: 'cancelled', scheduled_date: '2025-12-10', appointment: { customer_name: '李四' } },
                    { id: 3, status: 'completed', scheduled_date: '2025-12-10', appointment: { customer_name: '王五' } },
                    { id: 4, status: 'scheduled', scheduled_date: '2025-12-11', appointment: { customer_name: '赵六' } },
                    { id: 5, status: 'cancelled', scheduled_date: '2025-12-11', appointment: { customer_name: '钱七' } },
                ];

                // 测试过滤逻辑
                const testResults = [];

                // 测试周视图过滤
                const weekViewFiltered = mockSchedules.filter(schedule => schedule.status !== 'cancelled');
                testResults.push({
                    test: '周视图过滤测试',
                    original: mockSchedules.length,
                    filtered: weekViewFiltered.length,
                    cancelled: mockSchedules.filter(s => s.status === 'cancelled').length,
                    success: weekViewFiltered.length === 3 && mockSchedules.filter(s => s.status === 'cancelled').length === 2
                });

                // 测试月视图过滤
                const monthViewFiltered = mockSchedules.filter(schedule => schedule.status !== 'cancelled');
                testResults.push({
                    test: '月视图过滤测试',
                    original: mockSchedules.length,
                    filtered: monthViewFiltered.length,
                    cancelled: mockSchedules.filter(s => s.status === 'cancelled').length,
                    success: monthViewFiltered.length === 3 && mockSchedules.filter(s => s.status === 'cancelled').length === 2
                });

                // 测试特定日期过滤
                const tuesdaySchedules = mockSchedules.filter(s => s.scheduled_date === '2025-12-10');
                const tuesdayFiltered = tuesdaySchedules.filter(s => s.status !== 'cancelled');
                testResults.push({
                    test: '周二排班过滤测试',
                    original: tuesdaySchedules.length,
                    filtered: tuesdayFiltered.length,
                    cancelled: tuesdaySchedules.filter(s => s.status === 'cancelled').length,
                    success: tuesdayFiltered.length === 2 && tuesdaySchedules.filter(s => s.status === 'cancelled').length === 1
                });

                // 显示结果
                let html = '<h2>测试结果</h2>';
                testResults.forEach(result => {
                    const className = result.success ? 'success' : 'error';
                    html += `
                        <div class="test-result ${className}">
                            <h3>${result.test}</h3>
                            <p>原始排班数: ${result.original}</p>
                            <p>过滤后排班数: ${result.filtered}</p>
                            <p>已取消排班数: ${result.cancelled}</p>
                            <p>测试结果: ${result.success ? '✅ 通过' : '❌ 失败'}</p>
                        </div>
                    `;
                });

                // 显示模拟数据
                html += '<h2>模拟数据</h2>';
                html += '<pre>' + JSON.stringify(mockSchedules, null, 2) + '</pre>';

                // 显示过滤后数据
                html += '<h2>过滤后数据</h2>';
                html += '<pre>' + JSON.stringify(weekViewFiltered, null, 2) + '</pre>';

                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">测试失败: ${error.message}</div>`;
            }
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // 页面加载时自动运行测试
        window.onload = function() {
            testScheduleFilter();
        };
    </script>
</body>
</html>
