<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约人数据显示测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            background: #f8f9fa;
        }
        .test-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
        }
        .label {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .value {
            font-weight: 500;
            color: #212529;
        }
        .missing {
            color: #dc3545;
            font-style: italic;
        }
        .success {
            color: #28a745;
        }
        .warning {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <h1>🔍 预约人数据显示测试</h1>
    <p>这个页面模拟护士页面中预约人数据的显示逻辑</p>

    <div class="test-section">
        <h2>📊 测试数据结构</h2>
        <div id="test-data"></div>
    </div>

    <div class="test-section">
        <h2>🎯 显示逻辑测试</h2>
        <div id="display-logic"></div>
    </div>

    <div class="test-section">
        <h2>💡 修复建议</h2>
        <div id="suggestions"></div>
    </div>

    <script>
        // 模拟不同的数据结构
        const testCases = [
            {
                name: "完整数据 - 直接包含sales_name",
                data: {
                    id: "1",
                    customer_name: "张三",
                    sales_name: "销售员李四",
                    companion_names: ["王五", "赵六"],
                    total_people: 3,
                    appointment: {
                        customer_name: "张三",
                        sales_name: "销售员李四"
                    }
                }
            },
            {
                name: "嵌套数据 - sales_name在appointment中",
                data: {
                    id: "2",
                    customer_name: "钱七",
                    companion_names: ["孙八"],
                    total_people: 2,
                    appointment: {
                        customer_name: "钱七",
                        sales_name: "客服专员周九"
                    }
                }
            },
            {
                name: "缺失数据 - 没有预约人信息",
                data: {
                    id: "3",
                    customer_name: "吴十",
                    companion_names: [],
                    total_people: 1,
                    appointment: {
                        customer_name: "吴十"
                    }
                }
            },
            {
                name: "多层嵌套 - fullAppointment中的数据",
                data: {
                    id: "4",
                    customer_name: "郑十一",
                    companion_names: ["王十二"],
                    total_people: 2,
                    fullAppointment: {
                        customer_name: "郑十一",
                        sales_name: "业务代表刘十三"
                    }
                }
            }
        ];

        // 模拟前端显示逻辑
        function getSalesName(task) {
            return task.sales_name || 
                   task.appointment?.sales_name || 
                   task.fullAppointment?.sales_name || 
                   null;
        }

        function getCustomerName(task) {
            return task.appointment?.customer_name || 
                   task.customer_name || 
                   task.fullAppointment?.customer_name || 
                   '未知客户';
        }

        function getCompanionNames(task) {
            return task.companion_names || 
                   task.appointment?.companion_names || 
                   task.fullAppointment?.companion_names || 
                   [];
        }

        function getTotalPeople(task) {
            return task.total_people || 
                   task.appointment?.total_people || 
                   task.fullAppointment?.total_people || 
                   1;
        }

        // 渲染测试数据
        function renderTestData() {
            const container = document.getElementById('test-data');
            
            testCases.forEach((testCase, index) => {
                const div = document.createElement('div');
                div.className = 'test-item';
                
                const salesName = getSalesName(testCase.data);
                const customerName = getCustomerName(testCase.data);
                const companionNames = getCompanionNames(testCase.data);
                const totalPeople = getTotalPeople(testCase.data);
                
                div.innerHTML = `
                    <h4>${testCase.name}</h4>
                    <div class="label">主客户:</div>
                    <div class="value">${customerName}</div>
                    
                    <div class="label">预约人:</div>
                    <div class="value ${salesName ? 'success' : 'missing'}">
                        ${salesName || '❌ 缺失'}
                    </div>
                    
                    <div class="label">同行客户:</div>
                    <div class="value">${companionNames.length > 0 ? companionNames.join(', ') : '无'}</div>
                    
                    <div class="label">总人数:</div>
                    <div class="value">${totalPeople} 人</div>
                `;
                
                container.appendChild(div);
            });
        }

        // 渲染显示逻辑测试
        function renderDisplayLogic() {
            const container = document.getElementById('display-logic');
            
            const logicTests = [
                {
                    name: "EnhancedTaskCard 显示逻辑",
                    code: `task.sales_name || task.appointment?.sales_name`,
                    description: "优先显示直接的sales_name，然后是appointment中的sales_name"
                },
                {
                    name: "SchedulePage 显示逻辑", 
                    code: `schedule.sales_name || schedule.appointment?.sales_name || schedule.fullAppointment?.sales_name`,
                    description: "三层fallback：直接字段 → appointment → fullAppointment"
                },
                {
                    name: "HistoryPage 表格显示",
                    code: `task.sales_name || task.appointment?.sales_name || task.fullAppointment?.sales_name || '-'`,
                    description: "表格中显示预约人，缺失时显示'-'"
                }
            ];

            logicTests.forEach(test => {
                const div = document.createElement('div');
                div.className = 'test-item';
                div.innerHTML = `
                    <h4>${test.name}</h4>
                    <div class="label">代码逻辑:</div>
                    <code style="background: #f1f3f4; padding: 4px 8px; border-radius: 4px; font-family: monospace;">
                        ${test.code}
                    </code>
                    <div class="label" style="margin-top: 8px;">说明:</div>
                    <div class="value">${test.description}</div>
                `;
                container.appendChild(div);
            });
        }

        // 渲染修复建议
        function renderSuggestions() {
            const container = document.getElementById('suggestions');
            
            const suggestions = [
                {
                    title: "1. 数据库层面",
                    items: [
                        "确保appointments表中的sales_name字段有数据",
                        "如果sales_name为空，可以从created_by关联的profiles表获取创建者姓名",
                        "运行数据修复脚本：node add-sales-name-to-existing-data.cjs"
                    ]
                },
                {
                    title: "2. API层面", 
                    items: [
                        "确认API查询正确JOIN了profiles表",
                        "验证COALESCE(sales_p.full_name, creator_p.full_name) as sales_name逻辑",
                        "检查API返回的数据是否包含sales_name字段"
                    ]
                },
                {
                    title: "3. 前端层面",
                    items: [
                        "已添加多层fallback逻辑：task.sales_name || task.appointment?.sales_name",
                        "在EnhancedTaskCard、TaskPage、SchedulePage中都已实现",
                        "如果仍然不显示，检查浏览器开发者工具中的网络请求"
                    ]
                }
            ];

            suggestions.forEach(suggestion => {
                const div = document.createElement('div');
                div.className = 'test-item';
                
                const itemsHtml = suggestion.items.map(item => `<li>${item}</li>`).join('');
                
                div.innerHTML = `
                    <h4>${suggestion.title}</h4>
                    <ul style="margin: 8px 0; padding-left: 20px;">
                        ${itemsHtml}
                    </ul>
                `;
                container.appendChild(div);
            });
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            renderTestData();
            renderDisplayLogic();
            renderSuggestions();
        });
    </script>
</body>
</html>
